<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Topic GCSE Higher/Intermediate – Histograms</title>
<style>
:root{--purple:#67358a;--purple2:#8452a6;--ink:#20242a;--muted:#667085;--bg:#f5f2f8;--card:#fff;--line:#d9d2e2;--good:#eaf6ed;--warn:#fff5db}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55}
header{background:var(--purple);color:#fff;padding:18px 22px;display:flex;gap:16px;align-items:center}
header img{width:70px;height:70px;object-fit:contain;background:transparent}
header h1{font-size:clamp(1.35rem,2.5vw,2rem);margin:0} header p{margin:3px 0 0}
.shell{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 106px)}
aside{background:#fff;border-right:1px solid var(--line);padding:16px;position:sticky;top:0;height:calc(100vh - 106px);overflow:auto}
main{padding:22px;max-width:1100px;width:100%;margin:auto}
.nav{width:100%;text-align:left;padding:10px 11px;margin:4px 0;border:0;border-radius:8px;background:transparent;cursor:pointer;font-size:.94rem}
.nav:hover,.nav.active{background:#efe7f5;color:#4c2469;font-weight:700}
.card,.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:0 0 16px;box-shadow:0 1px 2px #0000000d}
.card h2,.card h3{margin-top:0}.note{background:#f2eafa;border-left:5px solid var(--purple)}.warning{background:var(--warn);border-left:5px solid #c58a00;padding:13px;margin:14px 0;border-radius:6px}
.good{background:var(--good);border-left:5px solid #368c4c;padding:13px;margin:14px 0;border-radius:6px}
.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
button.btn,.tab{border:1px solid var(--purple);background:#fff;color:var(--purple);padding:9px 13px;border-radius:8px;font-weight:700;cursor:pointer}
button.primary,.tab.active{background:var(--purple);color:#fff}
input.answer{font-size:1rem;padding:9px;border:1px solid #aaa;border-radius:7px;min-width:150px}
table{border-collapse:collapse;width:100%;margin:12px 0;background:#fff} th,td{border:1px solid #aaa;padding:8px;text-align:center} th{background:#f0e9f5}
.diagram{overflow-x:auto;margin:12px 0}.diagram svg{max-width:100%;height:auto;display:block;margin:auto;background:#fff;border:1px solid #ddd;border-radius:8px}
.worked{border-top:1px solid #ddd;margin-top:12px;padding-top:12px}.step{margin:8px 0;padding:8px 10px;background:#faf8fc;border-radius:7px}
.progress{height:16px;background:#e7e7e7;border-radius:10px;overflow:hidden}.progress span{display:block;height:100%;background:var(--purple)}
.small{font-size:.9rem;color:var(--muted)}.formula{font-size:1.15rem;font-weight:700;text-align:center;padding:10px}
.printsheet{display:none}.qprint{page-break-inside:avoid;margin:0 0 28px}.solprint{page-break-inside:avoid;margin:0 0 18px}
footer{text-align:center;color:#666;padding:20px}
@media(max-width:600px){.diagram svg text{font-size:23px}}@media(max-width:800px){.shell{display:block}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}header img{width:56px;height:56px}}
@media print{header,aside,.noprint,footer,.tabs{display:none!important}.shell{display:block}.printsheet.printme{display:block!important}#app:has(.printme)>:not(.printme){display:none!important}.card,.tile{box-shadow:none}.printsheet{font-size:12pt}main{padding:0;max-width:none}.printme svg{max-height:320px}}
</style>
</head>

<script>
const S={
overview:{title:"Course Overview"},
grouped:{title:"1. Grouped Continuous Data",skills:["continuous","boundaries"]},
equal:{title:"2. Equal Class Width Frequency Diagrams",skills:["equalHeight","equalRead"]},
unequal:{title:"3. Why Unequal Class Widths Cause a Problem",skills:["unequalCompare","unequalReason"]},
area:{title:"4. Area Represents Frequency",skills:["area","areaCompare"]},
width:{title:"5. Class Width",skills:["width","widthTable"]},
discover:{title:"6. Discovering Frequency Density",skills:["discoverDensity","discoverCompare"]},
density:{title:"7. Calculating Frequency Density",skills:["density","densityTable"]},
draw:{title:"8. Drawing Histograms",skills:["drawDensity","drawTable"]},
read:{title:"9. Reading Frequencies from Histograms",skills:["frequency","readMulti"]},
missing:{title:"10. Missing Values",skills:["missingF","missingD","missingW"]},
scale:{title:"11. Unknown Vertical Scales",skills:["scale","scaleMulti"]},
partial:{title:"12. Parts of Classes — Estimation",skills:["partial","partialTwo","partialAcross"]},
prob:{title:"13. Percentages & Probabilities",skills:["percentage","probability","probAcross"]},
modal:{title:"14. Modal Class & Interpretation",skills:["modal","interpret","compare"]},
median:{title:"15. Estimating the Median",skills:["medianClass","medianEstimate"]},
multi:{title:"16. Multi-step GCSE Problems",skills:["multiTable","multiScale","multiPartial","multiProb","multiMedian"]},
mastery:{title:"17. Full Histogram Mastery Test"}
};

let sec="overview",tab="learn",q=null,ps=[],ms=[];
let prog=JSON.parse(localStorage.getItem("histogramMasteryProgressV2")||"{}");
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const C=a=>a[R(0,a.length-1)];
const fmt=n=>Number.isInteger(n)?String(n):String(Math.round(n*100)/100);
function save(){localStorage.setItem("histogramMasteryProgressV2",JSON.stringify(prog))}
function record(ok){let p=prog[sec]||{a:0,c:0};p.a++;if(ok)p.c++;prog[sec]=p;save()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function hist(bars,opt={}){
 const W=720,H=400,L=78,Rt=25,T=25,B=70,pw=W-L-Rt,ph=H-T-B;
 const xmin=Math.min(...bars.map(b=>b.lo)),xmax=Math.max(...bars.map(b=>b.hi));
 const ymax=opt.ymax||Math.max(...bars.map(b=>b.height))*1.2;
 const xs=x=>L+(x-xmin)/(xmax-xmin)*pw, ys=y=>T+ph-y/ymax*ph;
 let rects=bars.map((b,i)=>`<rect x="${xs(b.lo)}" y="${ys(b.height)}" width="${xs(b.hi)-xs(b.lo)}" height="${T+ph-ys(b.height)}" fill="#d9c6e8" stroke="#67358a" stroke-width="2"/>`).join("");
 let ticks=[...new Set(bars.flatMap(b=>[b.lo,b.hi]).concat((opt.shades||[]).flatMap(s=>[s.from,s.to])))].sort((a,b)=>a-b).map(x=>`<line x1="${xs(x)}" y1="${T+ph}" x2="${xs(x)}" y2="${T+ph+6}" stroke="#222"/><text x="${xs(x)}" y="${T+ph+25}" text-anchor="middle" font-size="14">${x}</text>`).join("");
 let yt="";
 if(opt.showY!==false){
   let st=[0.1,0.2,0.25,0.5,1,2,2.5,5,10,20,25,50,100].find(v=>ymax/v<=10+1e-9)||ymax/5;
   for(let i=0;i*st<=ymax+1e-9;i++){let y=i*st;yt+=`<line x1="${L-5}" y1="${ys(y)}" x2="${L}" y2="${ys(y)}" stroke="#222"/><text x="${L-10}" y="${ys(y)+5}" text-anchor="end" font-size="13">${fmt(y)}</text>`}
 }
 let shade="";
 if(opt.shades){
   shade=opt.shades.map(s=>{let b=bars[s.i];return `<rect x="${xs(s.from)}" y="${ys(b.height)}" width="${xs(s.to)-xs(s.from)}" height="${T+ph-ys(b.height)}" fill="#9b6dbc" opacity=".55" stroke="#67358a" stroke-width="2"/>`}).join("");
 }
 return `<div class="diagram"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Histogram">
 <line x1="${L}" y1="${T}" x2="${L}" y2="${T+ph}" stroke="#222" stroke-width="2"/><line x1="${L}" y1="${T+ph}" x2="${W-Rt}" y2="${T+ph}" stroke="#222" stroke-width="2"/>
 ${rects}${shade}${ticks}${yt}
 <text x="${L+pw/2}" y="${H-12}" text-anchor="middle" font-size="15">${opt.xlabel||"Value"}</text>
 <text x="18" y="${T+ph/2}" text-anchor="middle" font-size="15" transform="rotate(-90 18 ${T+ph/2})">${opt.ylabel||"Frequency density"}</text>
 </svg></div>`;
}
function freqDiagram(rows,opt={}){
 return hist(rows.map(r=>({lo:r.lo,hi:r.hi,height:r.f})),{ymax:opt.ymax||Math.max(...rows.map(r=>r.f))*1.2,ylabel:"Frequency",xlabel:opt.xlabel||"Value"});
}
function ftable(rows,showD=true){
 return `<table><tr><th>Class interval</th><th>Class width</th><th>Frequency</th>${showD?"<th>Frequency density</th>":""}</tr>${rows.map(r=>`<tr><td>${r.lo} &lt; x ≤ ${r.hi}</td><td>${r.hi-r.lo}</td><td>${r.f}</td>${showD?`<td>${fmt(r.f/(r.hi-r.lo))}</td>`:""}</tr>`).join("")}</table>`;
}
function steps(title,visual,arr){
 return `<div class="card"><h3>${title}</h3>${visual||""}<div class="worked">${arr.map((x,i)=>`<div class="step"><strong>Step ${i+1}.</strong> ${x}</div>`).join("")}</div></div>`;
}
function key(text){return `<div class="note"><strong>Key idea:</strong> ${text}</div>`}
function warning(text){return `<div class="warning"><strong>Common mistake:</strong> ${text}</div>`}

function overview(){
 return `<div class="card"><h2>Topic GCSE Higher/Intermediate – Histograms</h2>
 <p>This course assumes no prior confidence with histograms. It deliberately begins with grouped continuous data and equal class widths, then creates the need for frequency density before introducing the formula.</p>
 ${key("In a histogram, frequency is represented by <strong>area</strong>. When class widths are unequal, bar height is frequency density.")}
 <p>The later sections build to the demanding GCSE/IGCSE skills: recovering frequencies, unknown vertical scales, portions of classes, percentages, probabilities, median estimates and multi-step problems.</p>
 <p><strong>Exam coverage:</strong> general UK GCSE/IGCSE requirements common to AQA · Edexcel · OCR · WJEC · IGCSE.</p></div>
 <div class="card"><h3>Learning route</h3><ol>${Object.keys(S).filter(x=>!["overview","mastery"].includes(x)).map(k=>`<li>${S[k].title}</li>`).join("")}</ol></div>`;
}

function learn(){
 if(sec==="grouped") return `<div class="card"><h2>${S[sec].title}</h2>
 <p>Histogram questions begin with <strong>continuous numerical data</strong> collected into intervals. Continuous measurements can take any value within a range.</p>
 <p>For example, a journey might take 12.4 minutes, 12.41 minutes or 12.417 minutes. We therefore group values into intervals such as 10 &lt; t ≤ 15.</p></div>`
 +steps("Reading an interval","<p class='formula'>10 &lt; t ≤ 15</p>",[
 "The value must be greater than 10.",
 "The value may be equal to 15.",
 "The interval contains every continuous value between those boundaries."
 ])
 +steps("Why the bars touch","",["Neighbouring continuous intervals meet at their class boundaries.","There is no numerical gap between them, so histogram bars touch."])
 +warning("Do not decide that a graph is a histogram merely because the bars touch. The data and the way frequency is represented matter too.");

 if(sec==="equal"){let rows=[{lo:0,hi:10,f:4},{lo:10,hi:20,f:8},{lo:20,hi:30,f:5},{lo:30,hi:40,f:2}];return `<div class="card"><h2>${S[sec].title}</h2>
 <p>We begin with equal-width groups because they let us connect an ordinary frequency diagram with the idea of a histogram.</p>
 ${key("When every class has the same width, comparing bar heights gives the same ranking as comparing frequencies.")}</div>`
 +steps("Equal widths first",ftable(rows,false)+freqDiagram(rows,{ymax:10}),[
 "Every class width is 10.",
 "Because all widths are identical, a frequency of 8 can be shown twice as high as a frequency of 4.",
 "At this stage the vertical axis may be labelled frequency."
 ])
 +warning("This convenient height = frequency relationship only works because all class widths are equal.");}

 if(sec==="unequal"){let rows=[{lo:0,hi:10,f:20},{lo:10,hi:30,f:30},{lo:30,hi:35,f:20}];return `<div class="card"><h2>${S[sec].title}</h2>
 <p>Now suppose the classes have different widths. If we simply use frequency as the height, wide classes receive much more rectangle area merely because they are wide.</p></div>`
 +steps("A misleading graph",ftable(rows,false)+freqDiagram(rows,{ymax:35}),[
 "The first and third classes both have frequency 20.",
 "But their widths are 10 and 5.",
 "If both bars have height 20, their areas are 200 and 100.",
 "The graph would therefore give different visual amounts of area to equal frequencies."
 ])
 +steps("What must change?","",["We need equal frequencies to correspond to equal areas.","So the height must be adjusted to compensate for class width.","That adjusted height is called frequency density."]);}

 if(sec==="area") return `<div class="card"><h2>${S[sec].title}</h2>
 <p>The rectangle area rule is the foundation of the entire topic.</p>
 <div class="formula">Histogram bar area represents frequency</div>
 <div class="formula">Frequency = class width × frequency density</div></div>`
 +steps("One bar",hist([{lo:0,hi:10,height:3}],{ymax:4}),["Class width = 10.","Frequency density = 3.","Area = 10 × 3 = 30.","So the bar represents frequency 30."])
 +steps("Tallest does not necessarily mean most frequent",hist([{lo:0,hi:20,height:2},{lo:20,hi:25,height:5}],{ymax:6}),["First area = 20 × 2 = 40.","Second area = 5 × 5 = 25.","The taller bar has the smaller frequency."])
 +warning("Never decide which class has the greatest frequency by height alone when class widths differ.");

 if(sec==="width") return `<div class="card"><h2>${S[sec].title}</h2><p>Before calculating a density, calculate the width of the interval.</p>
 <div class="formula">Class width = upper boundary − lower boundary</div></div>`
 +steps("Example","<p class='formula'>15 &lt; x ≤ 35</p>",["Upper boundary = 35.","Lower boundary = 15.","Class width = 35 − 15 = 20."])
 +steps("Several widths","<table><tr><th>Interval</th><th>Width</th></tr><tr><td>0 &lt; x ≤ 5</td><td>5</td></tr><tr><td>5 &lt; x ≤ 15</td><td>10</td></tr><tr><td>15 &lt; x ≤ 40</td><td>25</td></tr></table>",["Subtract the boundaries for each row.","Do not count how many whole numbers appear in an interval."]);

 if(sec==="discover") return `<div class="card"><h2>${S[sec].title}</h2>
 <p>We want bar area to represent frequency. Since rectangle area = width × height, the height must be the amount of frequency per unit of width.</p></div>`
 +steps("Deriving the rule","<p>Suppose frequency = 40 and class width = 10.</p>",[
 "We need an area of 40.",
 "The bar width is fixed at 10.",
 "So its height must be 40 ÷ 10 = 4.",
 "That height is called the <strong>frequency density</strong>."
 ])
 +`<div class="card"><div class="formula">Frequency density = Frequency ÷ Class width</div></div>`
 +steps("Why wider classes often need shorter bars","",["If frequency 40 is spread across width 20, density = 2.","If the same frequency 40 is spread across width 10, density = 4.","Both bars have area 40."]);

 if(sec==="density") return `<div class="card"><h2>${S[sec].title}</h2><div class="formula">Frequency density = Frequency ÷ Class width</div></div>`
 +steps("One calculation","<table><tr><th>Interval</th><th>Frequency</th></tr><tr><td>20 &lt; x ≤ 30</td><td>40</td></tr></table>",["Width = 30 − 20 = 10.","Density = 40 ÷ 10 = 4."])
 +steps("Complete the density column",ftable([{lo:0,hi:10,f:20},{lo:10,hi:30,f:30},{lo:30,hi:35,f:20}]),["Widths are 10, 20 and 5.","Densities are 2, 1.5 and 4.","These densities become the histogram heights."]);

 if(sec==="draw"){let rows=[{lo:0,hi:10,f:20},{lo:10,hi:30,f:40},{lo:30,hi:40,f:30}];return `<div class="card"><h2>${S[sec].title}</h2><p>With unequal widths, calculate every frequency density before drawing.</p></div>`
 +steps("From table to graph",ftable(rows),["Calculate class widths: 10, 20, 10.","Calculate densities: 2, 2, 3.","Mark the class boundaries accurately on the horizontal axis.","Use frequency density on the vertical axis.","Draw each rectangle over its exact interval."])
 +hist(rows.map(r=>({lo:r.lo,hi:r.hi,height:r.f/(r.hi-r.lo)})),{ymax:4});}

 if(sec==="read"){let bars=[{lo:0,hi:10,height:2},{lo:10,hi:30,height:1.5},{lo:30,hi:40,height:4}];return `<div class="card"><h2>${S[sec].title}</h2><div class="formula">Frequency = class width × frequency density</div></div>`
 +steps("Read one class",hist(bars,{ymax:5}),["For 10 &lt; x ≤ 30, width = 20.","Density = 1.5.","Frequency = 20 × 1.5 = 30."])
 +steps("Recover the full frequency table","",["0–10: 10 × 2 = 20.","10–30: 20 × 1.5 = 30.","30–40: 10 × 4 = 40.","Total frequency = 90."]);}

 if(sec==="missing") return `<div class="card"><h2>${S[sec].title}</h2>
 <p>All three quantities are connected.</p>
 <div class="formula">Density = Frequency ÷ Width</div><div class="formula">Frequency = Density × Width</div><div class="formula">Width = Frequency ÷ Density</div></div>`
 +steps("Missing frequency","<p>Width = 12, density = 2.5</p>",["Frequency = 12 × 2.5 = 30."])
 +steps("Missing density","<p>Frequency = 45, width = 15</p>",["Density = 45 ÷ 15 = 3."])
 +steps("Missing width","<p>Frequency = 36, density = 2.4</p>",["Width = 36 ÷ 2.4 = 15."]);

 if(sec==="scale") return `<div class="card"><h2>${S[sec].title}</h2><p>Some exam questions omit the frequency-density numbers on the vertical axis. Use a class with known frequency to calibrate the scale.</p></div>`
 +steps("Calibrate first",hist([{lo:0,hi:10,height:4},{lo:10,hi:30,height:2}],{ymax:5,ylabel:"Graph height units"}),[
 "Suppose the first class has frequency 20.",
 "Its width is 10, so its true density is 20 ÷ 10 = 2.",
 "On the graph it is 4 units high.",
 "Therefore 4 graph units represent density 2, so 1 graph unit represents density 0.5.",
 "The second bar is 2 graph units high, so its density is 1.",
 "Its width is 20, so frequency = 20 × 1 = 20."
 ]);

 if(sec==="partial"){let bars=[{lo:0,hi:10,height:2},{lo:10,hi:30,height:3},{lo:30,hi:40,height:1}];return `<div class="card"><h2>${S[sec].title}</h2>
 <p>When a question asks for only part of a class, we make the standard grouped-data assumption that values are spread evenly through that class.</p></div>`
 +steps("Part of one class",hist(bars,{ymax:4,shades:[{i:1,from:10,to:15}]}),["The class 10–30 has density 3.","The required part 10–15 has width 5.","Estimated frequency = 5 × 3 = 15."])
 +steps("A range crossing a class boundary",hist(bars,{ymax:4,shades:[{i:1,from:25,to:30},{i:2,from:30,to:35}]}),["25–30 contributes 5 × 3 = 15.","30–35 contributes 5 × 1 = 5.","Estimated total = 20."])
 +warning("An answer involving part of a grouped class is an estimate, not an exact count.");}

 if(sec==="prob"){let bars=[{lo:0,hi:10,height:2},{lo:10,hi:30,height:3},{lo:30,hi:40,height:2}];return `<div class="card"><h2>${S[sec].title}</h2>
 <p>First turn the required histogram area into frequency. Then compare it with the total frequency.</p>
 <div class="formula">Percentage = required frequency ÷ total frequency × 100%</div>
 <div class="formula">Probability = required frequency ÷ total frequency</div></div>`
 +steps("Percentage example",hist(bars,{ymax:4,shades:[{i:1,from:10,to:20}]}),[
 "Frequencies are 20, 60 and 20, so total = 100.",
 "10–20 is half of the 10–30 class: width 10 at density 3 gives frequency 30.",
 "Percentage = 30 ÷ 100 × 100% = 30%."
 ])
 +steps("Probability example","",["Using the same distribution, P(30 &lt; x ≤ 40) = 20 ÷ 100 = 0.2."]);}

 if(sec==="modal"){let bars=[{lo:0,hi:10,height:3},{lo:10,hi:30,height:2},{lo:30,hi:40,height:3.5}];return `<div class="card"><h2>${S[sec].title}</h2>
 <p>The modal class is the class in which the data are most concentrated. When class widths differ, this is the class with the greatest <strong>frequency density</strong> (the tallest bar), which is not necessarily the class with the greatest frequency.</p></div>`
 +steps("Find the modal class",hist(bars,{ymax:4.5}),["Frequency densities: 0–10 is 3, 10–30 is 2, 30–40 is 3.5.","The greatest frequency density is 3.5.","The modal class is 30 &lt; x ≤ 40.","Note: 10–30 has the greatest frequency (20 × 2 = 40), but only because it is twice as wide."])
 +warning("With unequal class widths, do not choose the class with the greatest frequency as the modal class. Compare frequency densities.")
 +steps("What a histogram cannot tell you exactly","",["It does not show the individual observations.","It usually cannot give an exact mean or median without further information.","Any estimate within a class assumes an even spread."]);}

 if(sec==="median"){let bars=[{lo:0,hi:10,height:2},{lo:10,hi:20,height:4},{lo:20,hi:40,height:2}];return `<div class="card"><h2>${S[sec].title}</h2>
 <p>To estimate the median, first recover the frequencies and cumulative frequencies. Then locate the halfway observation and interpolate within its class.</p></div>`
 +steps("Worked example",hist(bars,{ymax:5}),[
 "Frequencies are 20, 40 and 40, giving total frequency 100.",
 "The median is at the 50th observation.",
 "Cumulative frequency reaches 20 by x = 10 and 60 by x = 20, so the median lies in 10–20.",
 "Within that class we need 50 − 20 = 30 of its 40 observations.",
 "30/40 = 3/4 of the class width 10.",
 "Estimated median = 10 + 3/4 × 10 = 17.5."
 ])
 +warning("The interpolation assumes observations are evenly distributed through the median class.");}

 if(sec==="multi") return `<div class="card"><h2>${S[sec].title}</h2>
 <p>Higher-level questions often hide the route. The safest approach is to turn the diagram back into widths, densities and frequencies before answering the final question.</p></div>`
 +steps("Reliable problem-solving chain","",[
 "Write down every class width.",
 "Decide whether the vertical scale already gives frequency density.",
 "If not, calibrate it using a known frequency.",
 "Recover the frequencies using area.",
 "For partial classes, use partial area.",
 "For percentages or probabilities, divide by the total frequency.",
 "For a median estimate, use cumulative frequency and interpolate.",
 "Check whether the question asks for an exact answer or an estimate."
 ])
 +steps("Example crossing two classes",hist([{lo:0,hi:10,height:2},{lo:10,hi:25,height:4},{lo:25,hi:45,height:1.5}],{ymax:5,shades:[{i:1,from:20,to:25},{i:2,from:25,to:30}]}),[
 "20–25 contributes 5 × 4 = 20.",
 "25–30 contributes 5 × 1.5 = 7.5.",
 "Estimated frequency from 20 to 30 = 27.5."
 ]);
 return "";
}

function make(skill){
 let w,d,f,lo,hi,bars,rows,total,need;
 if(skill==="continuous") return {text:"Which variable is continuous?",choices:["Number of pets","Time taken to complete a race","Number of goals"],ans:"Time taken to complete a race",why:"Time can take any value within an interval."};
 if(skill==="boundaries") return {text:"Which value belongs to the interval 10 < x ≤ 15?",choices:["10","12.6","15.1"],ans:"12.6",why:"It must be greater than 10 and no greater than 15."};
 if(skill==="equalHeight"){let a=C([3,4,5]),b=a*2;return{text:`Equal-width classes have frequencies ${a} and ${b}. How many times as tall should the second bar be on a frequency diagram?`,ans:2,why:`With equal widths, height can represent frequency directly. ${b} is twice ${a}.`}}
 if(skill==="equalRead"){rows=[{lo:0,hi:10,f:4},{lo:10,hi:20,f:8},{lo:20,hi:30,f:5}];return{text:"All classes have equal width. Which class has the greatest frequency?",ans:"10–20",why:"The 10–20 class has frequency 8, the greatest value.",diag:freqDiagram(rows,{ymax:10})}}
 if(skill==="unequalCompare") return {text:"Two classes both have frequency 20. Their widths are 5 and 10. If frequency were used as bar height, would the two bars have equal areas?",ans:"No",why:"Their areas would be 5×20=100 and 10×20=200, even though their frequencies are equal."};
 if(skill==="unequalReason") return {text:"Why can frequency not normally be used directly as histogram height when class widths differ?",choices:["Because frequency must be represented by area.","Because wider classes always have greater frequencies.","Because histogram bars must not touch."],ans:"Because frequency must be represented by area.",why:"Different widths would distort the areas if height were simply frequency."};
 if(skill==="area"){do{w=C([5,10,15,20]);d=C([1,1.5,2,2.5,3,4]);f=w*d}while(f%1);return{text:`A histogram bar has class width ${w} and frequency density ${d}. Find its frequency.`,ans:f,why:`Frequency = width × density = ${w} × ${d} = ${f}.`,diag:hist([{lo:0,hi:w,height:d}],{ymax:d+1})}}
 if(skill==="areaCompare"){bars=[{lo:0,hi:20,height:2},{lo:20,hi:25,height:5}];return{text:"Which class contains the greater frequency: 0–20 or 20–25?",ans:"0–20",why:"Areas are 20×2=40 and 5×5=25.",diag:hist(bars,{ymax:6})}}
 if(skill==="width"){lo=C([0,5,10,20,30]);w=C([5,10,15,20,25]);hi=lo+w;return{text:`Find the class width of ${lo} < x ≤ ${hi}.`,ans:w,why:`Width = ${hi} − ${lo} = ${w}.`}}
 if(skill==="widthTable"){rows=[{lo:0,hi:5,f:8},{lo:5,hi:20,f:15},{lo:20,hi:50,f:12}];return{text:"What is the width of the class 20 < x ≤ 50?",ans:30,why:"50 − 20 = 30.",diag:ftable(rows,false)}}
 if(skill==="discoverDensity"){w=C([5,10,20]);f=C([20,40,60]);d=f/w;return{text:`A class has frequency ${f} and width ${w}. What height gives the bar area ${f}?`,ans:d,why:`Height = area ÷ width = ${f} ÷ ${w} = ${d}. This height is the frequency density.`}}
 if(skill==="discoverCompare") return {text:"Two classes each have frequency 40. One has width 10 and the other width 20. What densities do they need?",ans:"4, 2",why:"40÷10=4 and 40÷20=2. Both bar areas are 40."};
 if(skill==="density"){do{w=C([5,10,15,20]);d=C([1,2,2.5,3,4]);f=w*d}while(f%1);lo=R(0,4)*10;hi=lo+w;return{text:`The class ${lo} < x ≤ ${hi} has frequency ${f}. Find its frequency density.`,ans:d,why:`Width = ${w}. Density = ${f} ÷ ${w} = ${d}.`}}
 if(skill==="densityTable"){rows=[{lo:0,hi:10,f:20},{lo:10,hi:30,f:40},{lo:30,hi:35,f:15}];return{text:"Find the density for 30 < x ≤ 35.",ans:3,why:"Width=5, so density=15÷5=3.",diag:ftable(rows,false)}}
 if(skill==="drawDensity"){rows=[{lo:0,hi:10,f:20},{lo:10,hi:30,f:30},{lo:30,hi:40,f:40}];return{text:"Calculate the three histogram bar heights.",ans:"2, 1.5, 4",why:"Divide each frequency by its class width.",diag:ftable(rows,false)}}
 if(skill==="drawTable"){w=C([5,10,20]);d=C([1,2,3,4]);f=w*d;return{text:`A class has width ${w} and frequency ${f}. What height should its histogram bar have?`,ans:d,why:`Density=${f}÷${w}=${d}.`}}
 if(skill==="frequency"){do{w=C([5,10,15,20]);d=C([1,1.5,2,3,4]);f=w*d}while(f%1);return{text:`A bar has width ${w} and density ${d}. Find its frequency.`,ans:f,why:`Frequency=${w}×${d}=${f}.`,diag:hist([{lo:0,hi:w,height:d}],{ymax:d+1})}}
 if(skill==="readMulti"){bars=[{lo:0,hi:10,height:2},{lo:10,hi:30,height:1.5},{lo:30,hi:40,height:4}];return{text:"Find the total frequency.",ans:90,why:"Areas: 10×2=20, 20×1.5=30, 10×4=40; total 90.",diag:hist(bars,{ymax:5})}}
 if(skill==="missingF"){do{w=C([8,10,12,15,20]);d=C([1.5,2,2.5,3,4]);f=w*d}while(f%1);return{text:`Width=${w}, density=${d}. Find frequency.`,ans:f,why:`Frequency=${w}×${d}=${f}.`}}
 if(skill==="missingD"){do{w=C([5,10,12,15]);d=C([2,2.5,3,4]);f=w*d}while(f%1);return{text:`Frequency=${f}, width=${w}. Find density.`,ans:d,why:`Density=${f}÷${w}=${d}.`}}
 if(skill==="missingW"){do{w=C([5,10,12,15,20]);d=C([1.5,2,2.5,3]);f=w*d}while(f%1);return{text:`Frequency=${f}, density=${d}. Find class width.`,ans:w,why:`Width=${f}÷${d}=${w}.`}}
 if(skill==="scale"){let gu=C([2,4,5]),trueD=C([1,2,2.5]),ww=C([10,20]),ff=ww*trueD,per=trueD/gu;return{text:`A known bar is ${gu} graph units high, width ${ww}, frequency ${ff}. What density does 1 graph unit represent?`,ans:per,why:`True density=${ff}÷${ww}=${trueD}; ${trueD}÷${gu}=${per}.`}}
 if(skill==="scaleMulti"){bars=[{lo:0,hi:10,height:4},{lo:10,hi:30,height:2}];return{text:"The first class has frequency 20. Use it to find the frequency of the second class.",ans:20,why:"First true density=2, so 4 graph units represent density 2. One graph unit=0.5. Second density=1; frequency=20×1=20.",diag:hist(bars,{ymax:5,ylabel:"Graph height units"})}}
 if(skill==="partial"){w=C([10,20,30]);d=C([1,2,3]);let part=w/2;return{text:`A class has width ${w} and density ${d}. Estimate the frequency in half of the class.`,ans:part*d,why:`Half-width=${part}; frequency=${part}×${d}=${part*d}.`}}
 if(skill==="partialTwo"){bars=[{lo:0,hi:10,height:2},{lo:10,hi:30,height:3}];return{text:"Estimate the frequency between 10 and 15.",ans:15,why:"Width 5 at density 3 gives 15.",diag:hist(bars,{ymax:4,shades:[{i:1,from:10,to:15}]})}}
 if(skill==="partialAcross"){bars=[{lo:0,hi:10,height:2},{lo:10,hi:30,height:3},{lo:30,hi:40,height:1}];return{text:"Estimate the frequency between 25 and 35.",ans:20,why:"25–30:5×3=15; 30–35:5×1=5; total=20.",diag:hist(bars,{ymax:4,shades:[{i:1,from:25,to:30},{i:2,from:30,to:35}]})}}
 if(skill==="percentage"){bars=[{lo:0,hi:10,height:2},{lo:10,hi:30,height:3},{lo:30,hi:40,height:2}];return{text:"What percentage of observations lie in 30 < x ≤ 40?",ans:20,why:"Frequencies are 20,60,20; total=100. Percentage=20%.",diag:hist(bars,{ymax:4})}}
 if(skill==="probability"){bars=[{lo:0,hi:10,height:2},{lo:10,hi:30,height:3},{lo:30,hi:40,height:2}];return{text:"Find P(0 < x ≤ 10). Give a decimal.",ans:0.2,why:"Frequency=20; total=100; probability=20/100=0.2.",diag:hist(bars,{ymax:4})}}
 if(skill==="probAcross"){bars=[{lo:0,hi:10,height:2},{lo:10,hi:30,height:3},{lo:30,hi:40,height:2}];return{text:"Estimate P(20 < x ≤ 35).",ans:0.4,why:"20–30 gives 10×3=30 and 30–35 gives 5×2=10. Required=40; total=100; probability=0.4.",diag:hist(bars,{ymax:4,shades:[{i:1,from:20,to:30},{i:2,from:30,to:35}]})}}
 if(skill==="modal"){bars=[{lo:0,hi:10,height:3},{lo:10,hi:30,height:2},{lo:30,hi:40,height:3.5}];return{text:"Which class is modal?",ans:"30–40",why:"Frequency densities are 3, 2 and 3.5. The greatest frequency density is 3.5, so the modal class is 30–40. (10–30 has the greatest frequency, 40, only because it is twice as wide.)",diag:hist(bars,{ymax:4.5})}}
 if(skill==="interpret") return {text:"Why can a histogram not normally tell you the exact individual values?",choices:["The data are grouped into class intervals.","The vertical axis shows frequency density.","The bars have different widths."],ans:"The data are grouped into class intervals.",why:"It shows interval frequencies, not each observation."};
 if(skill==="compare") return {text:"A narrow bar is taller than a wide bar. Can you conclude the narrow class has greater frequency?",ans:"No",why:"Frequency depends on area, not height alone."};
 if(skill==="medianClass"){bars=[{lo:0,hi:10,height:2},{lo:10,hi:20,height:4},{lo:20,hi:40,height:2}];return{text:"Which class contains the median?",ans:"10–20",why:"Frequencies 20,40,40 total 100. The 50th observation lies in 10–20.",diag:hist(bars,{ymax:5})}}
 if(skill==="medianEstimate"){bars=[{lo:0,hi:10,height:2},{lo:10,hi:20,height:4},{lo:20,hi:40,height:2}];return{text:"Estimate the median.",ans:17.5,why:"Total=100; median position=50. Before median class CF=20. Need 30 of 40 through width 10: 10+(30/40)×10=17.5.",diag:hist(bars,{ymax:5})}}
 if(skill==="multiTable"){rows=[{lo:0,hi:10,f:15},{lo:10,hi:25,f:45},{lo:25,hi:45,f:30}];return{text:"Calculate all densities and identify the tallest bar.",ans:"1.5, 3, 1.5; 10–25",why:"Densities:15÷10=1.5,45÷15=3,30÷20=1.5.",diag:ftable(rows,false)}}
 if(skill==="multiScale") return make("scaleMulti");
 if(skill==="multiPartial"){bars=[{lo:0,hi:10,height:2},{lo:10,hi:25,height:4},{lo:25,hi:45,height:1.5}];return{text:"Estimate the frequency between 20 and 30.",ans:27.5,why:"20–25:5×4=20; 25–30:5×1.5=7.5; total=27.5.",diag:hist(bars,{ymax:5,shades:[{i:1,from:20,to:25},{i:2,from:25,to:30}]})}}
 if(skill==="multiProb") return make("probAcross");
 if(skill==="multiMedian") return make("medianEstimate");
 return {text:"State the key histogram relationship.",ans:"Frequency = class width × frequency density",why:"Histogram area represents frequency."};
}

function normalise(x){return String(x).trim().toLowerCase().replace(/°/g,"").replace(/[–—]/g,"-").replace(/\s+/g,"").replace(/(\d)(?:<x(?:≤|<=)|to)(\d)/g,"$1-$2").replace(/;/g,",").replace(/\.$/,"")}
function qt(x){return x.text+(x.choices?`<p><em>Options:</em> ${x.choices.join(" &nbsp;·&nbsp; ")}</p>`:"")}
function test(){
 if(!q)q=make(C(S[sec].skills));
 let choices=q.choices?`<div class="actions">${q.choices.map(c=>`<button class="btn" onclick="document.getElementById('ans').value='${esc(c)}'">${c}</button>`).join("")}</div>`:"";
 return `<div class="card"><h2>Interactive Test</h2><div class="tile"><strong>Question.</strong> ${q.text}${q.diag||""}${choices}
 <p><input id="ans" class="answer" placeholder="Your answer"> <button class="btn primary" onclick="check()">Check</button> <button class="btn" onclick="newq()">New Question</button></p><div id="fb"></div>
 <details><summary>Show worked solution</summary><p><strong>Answer:</strong> ${q.ans}</p><p>${q.why}</p></details></div></div>`;
}
function check(){
 let v=document.getElementById("ans").value,ok=normalise(v)===normalise(q.ans);
 if(typeof q.ans==="number"){let fr=String(v).trim().match(/^(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)$/),z=fr?fr[1]/fr[2]:parseFloat(v);ok=Number.isFinite(z)&&Math.abs(z-q.ans)<1e-8}
 document.getElementById("fb").innerHTML=ok?`<div class="good"><strong>Correct.</strong> ${q.why}</div>`:`<div class="warning"><strong>Not yet.</strong> Use the worked solution to see the method, then try another question.</div>`;
 if(!q.done){q.done=1;record(ok)}
}
function newq(){q=make(C(S[sec].skills));render()}
function genprint(){ps=[];let skills=S[sec].skills;for(let i=0;i<8;i++)ps.push(make(skills[i%skills.length]));render()}
function printable(){
 if(!ps.length){let skills=S[sec].skills;for(let i=0;i<8;i++)ps.push(make(skills[i%skills.length]))}
 return `<div class="card"><h2>Printable Practice</h2><p>Eight questions with working space.</p><div class="actions noprint"><button class="btn primary" onclick="genprint()">Generate New Set</button><button class="btn" onclick="printx('pq')">Print Questions</button><button class="btn" onclick="printx('pa')">Print Worked Solutions</button></div>
 ${ps.map((x,i)=>`<div class="tile"><strong>${i+1}.</strong> ${qt(x)}${x.diag||""}<details><summary>Show worked solution</summary><p><strong>Answer:</strong> ${x.ans}</p><p>${x.why}</p></details></div>`).join("")}</div>
 <div id="pq" class="printsheet"></div><div id="pa" class="printsheet"></div>`;
}
function printx(id){
 let h=`<h2>Mr Nathan's Maths Tuition</h2><h3>${S[sec].title} — Printable Practice</h3><p>Name: ____________________ Date: ____________</p><hr>`;
 document.getElementById("pq").innerHTML=h+ps.map((x,i)=>`<div class="qprint"><strong>${i+1}.</strong> ${qt(x)}${x.diag||""}<p>...........................................................................................................</p><p>...........................................................................................................</p><p>...........................................................................................................</p></div>`).join("");
 document.getElementById("pa").innerHTML=h+"<h3>Worked Solutions</h3>"+ps.map((x,i)=>`<div class="solprint"><strong>${i+1}.</strong> ${qt(x)}${x.diag||""}<p><strong>Answer:</strong> ${x.ans}</p><p>${x.why}</p></div>`).join("");
 document.querySelectorAll(".printsheet").forEach(x=>x.classList.remove("printme"));document.getElementById(id).classList.add("printme");window.print()
}
function progress(){
 let p=prog[sec]||{a:0,c:0},v=p.a?Math.round(100*p.c/p.a):0;
 return `<div class="card"><h2>Progress</h2><p><strong>${p.c}/${p.a||0} correct · ${v}%</strong></p><div class="progress"><span style="width:${v}%"></span></div><p>${v>=80?"This section is looking secure.":p.a?"More practice here would be useful before relying on this skill in mixed problems.":"Complete some Interactive Test questions to begin tracking this section."}</p></div>`;
}
function makem(r=true){
 const pool=["continuous","width","unequalReason","area","density","drawDensity","frequency","missingF","scaleMulti","partialAcross","percentage","probAcross","modal","medianEstimate","multiTable","multiPartial"];
 ms=pool.map(make);if(r)render()
}
function mastery(){
 if(!ms.length)makem(false);
 return `<div class="card"><h2>Full Histogram Mastery Test</h2><p>This mixed test moves from first principles to challenging Higher/Intermediate histogram reasoning.</p><div class="actions noprint"><button class="btn primary" onclick="makem(true)">Generate New Test</button><button class="btn" onclick="mprint(false)">Print Test</button><button class="btn" onclick="mprint(true)">Print Worked Solutions</button></div>
 ${ms.map((x,i)=>`<div class="tile"><strong>${i+1}.</strong> ${qt(x)}${x.diag||""}<details><summary>Show worked solution</summary><p><strong>Answer:</strong> ${x.ans}</p><p>${x.why}</p></details></div>`).join("")}</div><div id="mq" class="printsheet"></div><div id="ma" class="printsheet"></div>`;
}
function mprint(sol){
 let h=`<h2>Mr Nathan's Maths Tuition</h2><h3>Topic GCSE Higher/Intermediate – Histograms — Full Mastery Test</h3><p>Name: ____________________ Date: ____________</p><hr>`;
 document.getElementById("mq").innerHTML=h+ms.map((x,i)=>`<div class="qprint"><strong>${i+1}.</strong> ${qt(x)}${x.diag||""}<p>...........................................................................................................</p><p>...........................................................................................................</p><p>...........................................................................................................</p></div>`).join("");
 document.getElementById("ma").innerHTML=h+"<h3>Worked Solutions</h3>"+ms.map((x,i)=>`<div class="solprint"><strong>${i+1}.</strong> ${qt(x)}${x.diag||""}<p><strong>Answer:</strong> ${x.ans}</p><p>${x.why}</p></div>`).join("");
 document.querySelectorAll(".printsheet").forEach(x=>x.classList.remove("printme"));document.getElementById(sol?"ma":"mq").classList.add("printme");window.print()
}
function tabs(){return `<div class="tabs noprint">${["learn","test","print","progress"].map(x=>`<button class="tab ${tab===x?"active":""}" onclick="settab('${x}')">${x==="learn"?"Learn":x==="test"?"Interactive Test":x==="print"?"Printable Practice":"Progress"}</button>`).join("")}</div>`}

function buildNav(){
 document.getElementById("nav").innerHTML=Object.keys(S).map(k=>`<button class="nav ${k===sec?"active":""}" data-s="${k}">${S[k].title}</button>`).join("");
 document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>{sec=b.dataset.s;tab="learn";q=null;ps=[];render();window.scrollTo({top:0,behavior:"smooth"})})
}
function render(){
 buildNav();let a=document.getElementById("app");
 if(sec==="overview"){a.innerHTML=overview();return}
 if(sec==="mastery"){a.innerHTML=mastery();return}
 a.innerHTML=tabs()+(tab==="learn"?learn():tab==="test"?test():tab==="print"?printable():progress())
}
render();
